[package]
name = "artcraft-launcher-core"
description = "Craft Unofficial Launcher core: the runtime catalog of unofficial apps, versions, release parsing and asset choice (pure, wasm-safe)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
# Calendar conversion (jiff); see AGENTS.md. Only civil-date math is used, no time zone.
jiff = { workspace = true }
craft-app-descriptor = { workspace = true }

[features]
# The fixed test catalog (`core::sample`), for other crates' tests. Never enabled in a release build.
sample-catalog = []
