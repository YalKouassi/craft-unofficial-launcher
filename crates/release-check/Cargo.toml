[package]
name = "craft-release-check"
description = "Checks that a release keeps the craft-app.json release contract, before upload (a dist folder) or after (a GitHub release)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "craft-release-check"
path = "src/main.rs"

[dependencies]
craft-app-descriptor = { path = "../descriptor" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
# HTTPS over rustls with the OS verifying certificates, as in crates/native (no bundled CDLA roots).
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }

[dev-dependencies]
tempfile = "3"
