name: Release

# A release starts from a version tag: `cargo xtask version set X.Y.Z`, commit, push, then
# `git tag vX.Y.Z && git push origin vX.Y.Z`. Not from a push to the release branch: on that branch
# the shared workflow fails the Windows and macOS builds outright when the signing secrets are
# missing. From a tag they build signed when the secrets are set and unsigned when they aren't.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write
  # craft-common-actions' Flatpak job publishes the Flatpak to this repo's own ghcr.io registry.
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: craft-unofficial-launcher
      # The draft release is named "<app-title> v<version>": "Craft Unofficial Launcher v1.2.3". The
      # assets come from packaging/*: craft-unofficial-launcher-<version>-<os>-<arch>[-portable].<ext>.
      app-title: Craft Unofficial Launcher
      version: ${{ inputs.version }}
      # macOS, Windows and Linux only.
      has-freebsd: false
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}

  # The tag must name the version in Cargo.toml, or the release would be drafted under another tag.
  tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Check the tag against Cargo.toml
        run: |
          VERSION="$(cargo xtask version)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($VERSION). Run cargo xtask version set first."
            exit 1
          fi

  # The shared workflow drafts the release only when every build succeeded, and the macOS build
  # can't run on this account at the moment. So this job drafts it from whatever built, as long as
  # every Windows, Linux and web package is there (macOS is added when it built). The launcher
  # updates itself through the same release contract it asks of the apps (docs/craft-app-spec.md):
  # the release carries craft-app.json, its icon and a SHA256SUMS.txt that lists every package.
  # The whole release is checked before the draft is made; publishing it stays a manual step.
  contract:
    needs: [tag, release]
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_OVERRIDE: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Read the version
        run: |
          VERSION="${VERSION_OVERRIDE:-$(cargo xtask version)}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Download the packages this run built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require every Windows, Linux and web package
        run: |
          stem="craft-unofficial-launcher-$VERSION"
          missing=""
          for arch in x64 arm64 x86; do
            for f in "$stem-windows-$arch.msi" "$stem-windows-$arch-portable.zip"; do
              [ -f "dist/$f" ] || missing="$missing $f"
            done
          done
          for arch in x86_64 aarch64; do
            for ext in AppImage AppImage.zsync deb rpm tar.gz flatpak pkg.tar.zst; do
              [ -f "dist/$stem-linux-$arch.$ext" ] || missing="$missing $stem-linux-$arch.$ext"
            done
          done
          for ext in deb rpm tar.gz; do
            [ -f "dist/$stem-linux-riscv64.$ext" ] || missing="$missing $stem-linux-riscv64.$ext"
          done
          [ -f "dist/craft-unofficial-launcher-web-$VERSION.zip" ] || missing="$missing craft-unofficial-launcher-web-$VERSION.zip"
          if [ -n "$missing" ]; then
            echo "::error::These builds failed or were skipped, so no release is drafted:$missing"
            exit 1
          fi
          compgen -G 'dist/*-macos-*' > /dev/null || echo "::warning::No macOS build; the release is drafted without one."
      - name: Add craft-app.json and the icon, and list everything in SHA256SUMS.txt
        run: |
          cp craft-app.json dist/craft-app.json
          cp assets/app-icon/hicolor/128x128/apps/io.github.yalkouassi.craft-unofficial-launcher.png dist/craft-unofficial-launcher-128.png
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
      - name: Check the release contract
        run: cargo run -p craft-release-check -- dir dist --repo YalKouassi/craft-unofficial-launcher --tag "$TAG"
      - name: Create or update the draft
        working-directory: dist
        run: |
          title="Craft Unofficial Launcher $TAG"
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Bump the version (cargo xtask version set) and tag again."
              exit 1
            fi
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --draft --title "$title" --target "$GITHUB_SHA"
            gh release upload "$TAG" --clobber -- *
          else
            gh release create "$TAG" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
          fi
